name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:generate && npm run build -w @cdn/shared -w @cdn/storage -w @cdn/database -w @cachenetworks/cdnpanel-sdk -w @cachenetworks/cdnctl
      - name: Package SDK, CLI and OpenAPI document
        run: |
          mkdir -p dist-release
          npm pack -w @cachenetworks/cdnpanel-sdk -w @cachenetworks/cdnctl --pack-destination dist-release
          cp docs/openapi.json dist-release/
          tar -czf dist-release/cdnpanel-sdk-python.tar.gz -C sdks python
          tar -czf dist-release/cdnpanel-sdk-go.tar.gz -C sdks go
          (cd dist-release && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist-release/*
