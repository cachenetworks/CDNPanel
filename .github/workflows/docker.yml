name: CI & images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TEST_DATABASE_URL: postgresql://cdn:cdn_dev_password@127.0.0.1:5432/cdn_test
  TEST_REDIS_URL: redis://127.0.0.1:6379/15

jobs:
  test:
    name: Typecheck, lint, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: cdn, POSTGRES_PASSWORD: cdn_dev_password, POSTGRES_DB: cdn_test }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U cdn" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - name: Install FFmpeg and PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg postgresql-client
      - run: npm ci
      - run: npm run db:generate && npm run build -w @cdn/shared -w @cdn/storage -w @cdn/database -w @cachenetworks/cdnpanel-sdk
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Backup / restore round trip
        run: ./scripts/test-backup-restore.sh
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          PGPASSWORD: cdn_dev_password

  migrations:
    name: Migration checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: cdn, POSTGRES_PASSWORD: cdn_dev_password, POSTGRES_DB: cdn }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U cdn" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Fresh database migrates cleanly
        run: npm run db:migrate
        env: { DATABASE_URL: 'postgresql://cdn:cdn_dev_password@127.0.0.1:5432/cdn' }
      - name: Upgrade path from the previous release migrates cleanly
        run: |
          PGPASSWORD=cdn_dev_password psql -h 127.0.0.1 -U cdn -d cdn -c 'CREATE DATABASE cdn_upgrade'
          mkdir -p /tmp/old && cp -r packages/database/prisma /tmp/old/
          # Apply only the migrations of the oldest release, then the full set on top.
          ls -1 packages/database/prisma/migrations | grep -v migration_lock | tail -n +2 | while read m; do rm -rf "/tmp/old/prisma/migrations/$m"; done
          DATABASE_URL=postgresql://cdn:cdn_dev_password@127.0.0.1:5432/cdn_upgrade npx prisma migrate deploy --schema /tmp/old/prisma/schema.prisma
          DATABASE_URL=postgresql://cdn:cdn_dev_password@127.0.0.1:5432/cdn_upgrade npx prisma migrate deploy --schema packages/database/prisma/schema.prisma
      - name: Schema and migrations are in sync (no drift)
        run: |
          PGPASSWORD=cdn_dev_password psql -h 127.0.0.1 -U cdn -d cdn -c 'CREATE DATABASE cdn_shadow'
          npx prisma migrate diff \
            --from-migrations packages/database/prisma/migrations \
            --to-schema-datamodel packages/database/prisma/schema.prisma \
            --shadow-database-url postgresql://cdn:cdn_dev_password@127.0.0.1:5432/cdn_shadow \
            --exit-code

  sdks:
    name: SDKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-go@v7
        with: { go-version: '1.22', cache: false }
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - run: npm ci
      - run: npm run db:generate && npm run build -w @cdn/shared -w @cdn/storage -w @cdn/database
      - name: Generated SDKs are up to date with the API
        run: npm run sdk:generate && git diff --exit-code -- docs/openapi.json packages/sdk-js/src/generated.ts sdks/
      - run: npm run build -w @cachenetworks/cdnpanel-sdk -w @cachenetworks/cdnctl
      - run: node packages/cli/dist/index.js --help
      - name: Go SDK vets
        working-directory: sdks/go
        run: go vet ./... && gofmt -l . | (! grep .)
      - name: Python SDK imports
        working-directory: sdks/python
        run: python -c "import cdnpanel; cdnpanel.CdnClient('https://example.com', 'k')"

  nginx:
    name: Nginx configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Render the template and run nginx -t (with and without PANEL_HOST)
        run: |
          for host in cdn.example.com ""; do
            docker run --rm -e PANEL_HOST="$host" -e NGINX_ENVSUBST_FILTER='^PANEL_HOST$' \
              --add-host api:127.0.0.1 --add-host web:127.0.0.1 \
              -v "$PWD/infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
              -v "$PWD/infrastructure/nginx/cdn.conf:/etc/nginx/templates/default.conf.template:ro" \
              nginx:1.27-alpine nginx -t
          done

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - name: No known high / critical vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high

  images:
    name: Image (${{ matrix.name }})
    needs: [test, migrations, sdks, nginx]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless Cosign signing + build provenance
      attestations: write
      security-events: write # Trivy SARIF upload
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: infrastructure/docker/api.Dockerfile
          - name: web
            dockerfile: infrastructure/docker/web.Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/cdnpanel-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: cdnpanel-${{ matrix.name }}:scan
          cache-from: type=gha,scope=${{ matrix.name }}
      - name: Trivy vulnerability scan (fails on fixable critical issues)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cdnpanel-${{ matrix.name }}:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - name: Trivy report (SARIF, all severities)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cdnpanel-${{ matrix.name }}:scan
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          skip-setup-trivy: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && github.event_name != 'pull_request'
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}
      - name: Build and push (SBOM + max provenance)
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Sign the image (Cosign keyless)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do cosign sign --yes "${tag%%:*}@${DIGEST}"; done
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/cdnpanel-${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: SPDX SBOM artifact
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/cdnpanel-${{ matrix.name }}@${{ steps.build.outputs.digest }}
          artifact-name: sbom-${{ matrix.name }}.spdx.json
          format: spdx-json
