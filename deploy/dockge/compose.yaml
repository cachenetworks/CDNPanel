# CDNPanel — Dockge stack (prebuilt images from GHCR, no source checkout needed).
#
# 1. In Dockge: + Compose → name "cdn" → paste this file → paste deploy/dockge/.env.example into the .env editor
#    and fill in the secrets.
# 2. Private images: once on the host run `docker login ghcr.io -u <github-user>` with a token that has read:packages.
# 3. Deploy, then: docker compose -f /opt/stacks/cdn/compose.yaml exec api npm run create-admin

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  APP_URL: ${APP_URL:?set APP_URL}
  CDN_URL: ${CDN_URL:?set CDN_URL}
  API_URL: ${API_URL:?set API_URL}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  DATABASE_URL: postgresql://${POSTGRES_USER:-cdn}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cdn}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
  SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
  MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:?set MASTER_ENCRYPTION_KEY}
  MASTER_ENCRYPTION_KEY_VERSION: ${MASTER_ENCRYPTION_KEY_VERSION:-1}
  MASTER_ENCRYPTION_KEYS_PREVIOUS: ${MASTER_ENCRYPTION_KEYS_PREVIOUS:-}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-LOCAL}
  LOCAL_STORAGE_PATH: /data/storage
  LOCAL_STORAGE_ALLOWED_ROOT: /data
  UPLOAD_TMP_PATH: /data/tmp
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-auto}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  # Only the nginx container (compose network) is trusted as a proxy.
  TRUST_PROXY: ${TRUST_PROXY:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
  TRUST_CLOUDFLARE_HEADERS: ${TRUST_CLOUDFLARE_HEADERS:-false}
  MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-5GB}
  DELIVERY_MODE: ${DELIVERY_MODE:-stream}
  X_ACCEL_PREFIX: /_protected_storage
  CLAMAV_HOST: ${CLAMAV_HOST:-}
  CLAMAV_PORT: ${CLAMAV_PORT:-3310}
  WEBHOOK_ALLOW_PRIVATE_NETWORKS: ${WEBHOOK_ALLOW_PRIVATE_NETWORKS:-false}
  # 2.0: custom domains, edge purges, observability (all optional)
  DOMAIN_CNAME_TARGET: ${DOMAIN_CNAME_TARGET:-}
  CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
  CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
  ASN_HEADER: ${ASN_HEADER:-}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cdn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cdn}
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?set REDIS_PASSWORD}', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  migrate:
    image: ${API_IMAGE:-ghcr.io/cachenetworks/cdnpanel-api:latest}
    environment: *app-env
    working_dir: /app
    command: ['npx', 'prisma', 'migrate', 'deploy', '--schema', 'packages/database/prisma/schema.prisma']
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    image: ${API_IMAGE:-ghcr.io/cachenetworks/cdnpanel-api:latest}
    restart: unless-stopped
    environment: *app-env
    volumes:
      - cdn-data:/data
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    image: ${API_IMAGE:-ghcr.io/cachenetworks/cdnpanel-api:latest}
    restart: unless-stopped
    environment:
      <<: *app-env
      SERVICE_NAME: cdn-worker
    command: ['node', '--import', './dist/otel.js', 'dist/worker/index.js']
    volumes:
      - cdn-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'kill -0 1']
      interval: 30s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    image: ${WEB_IMAGE:-ghcr.io/cachenetworks/cdnpanel-web:latest}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-8873}:8080'
    configs:
      - source: nginx_main
        target: /etc/nginx/nginx.conf
      - source: nginx_site
        target: /etc/nginx/conf.d/default.conf
    volumes:
      - cdn-data:/data:ro
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1']
      interval: 15s

  clamav:
    profiles: [clamav]
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav-db:/var/lib/clamav

  minio:
    profiles: [minio]
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cdnminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  redis-data:
  cdn-data:
  clamav-db:
  minio-data:

# Nginx configuration embedded so the stack is self-contained (mirrors infrastructure/nginx/).
configs:
  nginx_main:
    content: |
      worker_processes auto;
      pid /tmp/nginx.pid;
      events { worker_connections 4096; }

      http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        server_tokens off;
        sendfile on;
        tcp_nopush on;
        keepalive_timeout 65s;

        log_format json escape=json '{"time":"$$time_iso8601","remote":"$$remote_addr","method":"$$request_method",'
          '"uri":"$$uri","status":$$status,"bytes":$$body_bytes_sent,"rt":$$request_time,"ua":"$$http_user_agent"}';
        # $$uri (not $$request_uri) so signed-URL signatures in query strings are never logged.
        access_log /dev/stdout json;
        error_log /dev/stderr warn;

        # Cloudflare headers are only forwarded when the request comes from the local tunnel /
        # docker network. Anything else (e.g. a LAN client hitting the port directly) gets them stripped.
        geo $$trusted_edge {
          default 0;
          127.0.0.0/8 1;
          172.16.0.0/12 1;
        }
        map $$trusted_edge $$cf_connecting_ip { 1 $$http_cf_connecting_ip; default ""; }
        map $$trusted_edge $$cf_ipcountry     { 1 $$http_cf_ipcountry;     default ""; }

        limit_req_zone $$binary_remote_addr zone=auth:10m rate=10r/m;
        limit_req_status 429;

        include /etc/nginx/conf.d/*.conf;
      }
  nginx_site:
    content: |
      # Single-domain deployment (dashboard, API and file delivery on one host, e.g. cdn.cachedev.live).
      # TLS terminates at Cloudflare (tunnel); this server listens on plain HTTP inside the host.
      # Resolve service names at request time via Docker DNS so recreated containers (new IPs)
      # never leave Nginx pointing at a stale address.
      resolver 127.0.0.11 valid=10s ipv6=off;

      # Custom zone domains (assets.example.com) serve files at zone-relative paths. Every Host other
      # than the dashboard host (PANEL_HOST) is treated as a zone domain; the API answers 404 for
      # hostnames that are not verified. With PANEL_HOST unset this is disabled and zone domains are
      # served through /files, /p, /img, /media and /s URLs only.
      map "$$host:${PANEL_HOST:-}" $$zone_host {
        default                         1;
        "~^[^:]*:$$"                     0;   # PANEL_HOST not configured
        "~^([^:]+):\1$$"                 0;   # the dashboard host itself
        "~^(localhost|127\.0\.0\.1|nginx)(:|$$)" 0;
      }

      server {
        listen 8080;
        server_name _;
        set $$cdn_api http://api:4000;
        set $$cdn_web http://web:3000;

        client_max_body_size 5g;            # keep in sync with MAX_UPLOAD_SIZE
        client_body_timeout 300s;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $$host;
        proxy_set_header X-Forwarded-For $$remote_addr;   # overwrite, never append client-supplied values
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $$cf_connecting_ip;
        proxy_set_header CF-IPCountry $$cf_ipcountry;

        add_header X-Content-Type-Options nosniff always;

        # API: stream uploads straight to the app (no request buffering), long timeouts for big files.
        location /api/ {
          proxy_pass $$cdn_api;
          proxy_request_buffering off;
          proxy_buffering off;
          proxy_read_timeout 600s;
          proxy_send_timeout 600s;
        }
        location = /api/v1/auth/login {
          limit_req zone=auth burst=10 nodelay;
          proxy_pass $$cdn_api;
        }

        # Delivery: files, friendly paths, image transformations, media renditions, share links,
        # browser challenges, signed-cookie installation and domain-verification probes.
        # Authorization happens in the API; local files are served by nginx via X-Accel-Redirect.
        location ~ ^/(files|p|img|media|s|_challenge|_auth|\.well-known/cdnpanel)/ {
          proxy_pass $$cdn_api;
          proxy_buffering off;
          proxy_read_timeout 600s;
          proxy_force_ranges on;
        }
        location = /openapi.json { proxy_pass $$cdn_api; }
        location /health { proxy_pass $$cdn_api; }
        # /metrics is deliberately not routed: scrape api:4000/metrics from inside the network.

        # Internal location used only by X-Accel-Redirect from the API — not reachable directly.
        location /_protected_storage/ {
          internal;
          alias /data/storage/;
          sendfile on;
          tcp_nopush on;
          # nginx serves ranges/conditionals itself; headers set by the API are preserved.
        }

        # Zone-relative paths on custom domains, reached only through the rewrite below.
        location /_zone/ {
          internal;
          proxy_pass $$cdn_api;
          proxy_buffering off;
          proxy_read_timeout 600s;
          proxy_force_ranges on;
        }

        # Dashboard (or zone content on custom domains)
        location / {
          if ($$zone_host) {
            rewrite ^ /_zone$$uri last;
          }
          proxy_pass $$cdn_web;
          proxy_read_timeout 60s;
        }
      }
