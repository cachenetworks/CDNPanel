# Single-domain deployment (dashboard, API and file delivery on one host, e.g. cdn.cachedev.live).
# TLS terminates at Cloudflare (tunnel); this server listens on plain HTTP inside the host.
upstream cdn_api { server api:4000; keepalive 32; }
upstream cdn_web { server web:3000; keepalive 16; }

server {
  listen 8080;
  server_name _;

  client_max_body_size 5g;            # keep in sync with MAX_UPLOAD_SIZE
  client_body_timeout 300s;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append client-supplied values
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header CF-Connecting-IP $cf_connecting_ip;
  proxy_set_header CF-IPCountry $cf_ipcountry;

  add_header X-Content-Type-Options nosniff always;

  # API: stream uploads straight to the app (no request buffering), long timeouts for big files.
  location /api/ {
    proxy_pass http://cdn_api;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }
  location = /api/v1/auth/login {
    limit_req zone=auth burst=10 nodelay;
    proxy_pass http://cdn_api;
  }

  # File delivery: authorization happens in the API; bytes are served by nginx via X-Accel-Redirect.
  location ~ ^/(files|p)/ {
    proxy_pass http://cdn_api;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_force_ranges on;
  }
  location = /openapi.json { proxy_pass http://cdn_api; }
  location /health { proxy_pass http://cdn_api; }

  # Internal location used only by X-Accel-Redirect from the API — not reachable directly.
  location /_protected_storage/ {
    internal;
    alias /data/storage/;
    sendfile on;
    tcp_nopush on;
    # nginx serves ranges/conditionals itself; headers set by the API are preserved.
  }

  # Dashboard
  location / {
    proxy_pass http://cdn_web;
    proxy_read_timeout 60s;
  }
}
