# Rendered by the nginx image from /etc/nginx/templates/default.conf.template (envsubst of ${PANEL_HOST}).
#
# Single-domain deployment (dashboard, API and file delivery on one host, e.g. cdn.cachedev.live).
# TLS terminates at Cloudflare (tunnel); this server listens on plain HTTP inside the host.
# Resolve service names at request time via Docker DNS so recreated containers (new IPs)
# never leave Nginx pointing at a stale address.
resolver 127.0.0.11 valid=10s ipv6=off;

# Custom zone domains (assets.example.com) serve files at zone-relative paths. Every Host other
# than the dashboard host (PANEL_HOST) is treated as a zone domain; the API answers 404 for
# hostnames that are not verified. With PANEL_HOST unset this is disabled and zone domains are
# served through /files, /p, /img, /media and /s URLs only.
map "$host:${PANEL_HOST}" $zone_host {
  default                         1;
  "~^[^:]*:$"                     0;   # PANEL_HOST not configured
  "~^([^:]+):\1$"                 0;   # the dashboard host itself
  "~^(localhost|127\.0\.0\.1|nginx)(:|$)" 0;
}

server {
  listen 8080;
  server_name _;
  set $cdn_api http://api:4000;
  set $cdn_web http://web:3000;

  client_max_body_size 5g;            # keep in sync with MAX_UPLOAD_SIZE
  client_body_timeout 300s;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append client-supplied values
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header CF-Connecting-IP $cf_connecting_ip;
  proxy_set_header CF-IPCountry $cf_ipcountry;

  add_header X-Content-Type-Options nosniff always;

  # API: stream uploads straight to the app (no request buffering), long timeouts for big files.
  location /api/ {
    proxy_pass $cdn_api;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }
  location = /api/v1/auth/login {
    limit_req zone=auth burst=10 nodelay;
    proxy_pass $cdn_api;
  }

  # Delivery: files, friendly paths, image transformations, media renditions, share links,
  # browser challenges, signed-cookie installation and domain-verification probes.
  # Authorization happens in the API; local files are served by nginx via X-Accel-Redirect.
  location ~ ^/(files|p|img|media|s|_challenge|_auth|\.well-known/cdnpanel)/ {
    proxy_pass $cdn_api;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_force_ranges on;
  }
  location = /openapi.json { proxy_pass $cdn_api; }
  location /health { proxy_pass $cdn_api; }
  # /metrics is deliberately not routed: scrape api:4000/metrics from inside the network.

  # Internal location used only by X-Accel-Redirect from the API — not reachable directly.
  location /_protected_storage/ {
    internal;
    alias /data/storage/;
    sendfile on;
    tcp_nopush on;
    # nginx serves ranges/conditionals itself; headers set by the API are preserved.
  }

  # Zone-relative paths on custom domains, reached only through the rewrite below.
  location /_zone/ {
    internal;
    proxy_pass $cdn_api;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_force_ranges on;
  }

  # Dashboard (or zone content on custom domains)
  location / {
    if ($zone_host) {
      rewrite ^ /_zone$uri last;
    }
    proxy_pass $cdn_web;
    proxy_read_timeout 60s;
  }
}
