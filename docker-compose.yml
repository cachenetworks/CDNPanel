# Self-hosted CDN platform.
#   cp .env.example .env   # fill in secrets (see README)
#   docker compose pull && docker compose up -d   # prebuilt GHCR images (needs docker login ghcr.io)
#   docker compose up -d --build                  # or build from source
#   docker compose exec api npm run create-admin
#
# Optional services: `--profile clamav` (malware scanning), `--profile minio` (S3-compatible storage).
name: cdn

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  APP_URL: ${APP_URL:?set APP_URL}
  CDN_URL: ${CDN_URL:?set CDN_URL}
  API_URL: ${API_URL:?set API_URL}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  DATABASE_URL: postgresql://${POSTGRES_USER:-cdn}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cdn}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
  SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
  MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:?set MASTER_ENCRYPTION_KEY}
  MASTER_ENCRYPTION_KEY_VERSION: ${MASTER_ENCRYPTION_KEY_VERSION:-1}
  MASTER_ENCRYPTION_KEYS_PREVIOUS: ${MASTER_ENCRYPTION_KEYS_PREVIOUS:-}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-LOCAL}
  LOCAL_STORAGE_PATH: /data/storage
  LOCAL_STORAGE_ALLOWED_ROOT: /data
  UPLOAD_TMP_PATH: /data/tmp
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-auto}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  # Only the nginx container (compose network) is trusted as a proxy.
  TRUST_PROXY: ${TRUST_PROXY:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
  TRUST_CLOUDFLARE_HEADERS: ${TRUST_CLOUDFLARE_HEADERS:-false}
  MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-5GB}
  DELIVERY_MODE: ${DELIVERY_MODE:-stream}
  X_ACCEL_PREFIX: /_protected_storage
  CLAMAV_HOST: ${CLAMAV_HOST:-}
  CLAMAV_PORT: ${CLAMAV_PORT:-3310}
  WEBHOOK_ALLOW_PRIVATE_NETWORKS: ${WEBHOOK_ALLOW_PRIVATE_NETWORKS:-false}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cdn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cdn}
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?set REDIS_PASSWORD}', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  migrate:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    image: ${API_IMAGE:-ghcr.io/cachenetworks/cdnpanel-api:latest}
    environment: *app-env
    working_dir: /app
    command: ['npx', 'prisma', 'migrate', 'deploy', '--schema', 'packages/database/prisma/schema.prisma']
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    image: ${API_IMAGE:-ghcr.io/cachenetworks/cdnpanel-api:latest}
    restart: unless-stopped
    environment: *app-env
    volumes:
      - cdn-data:/data
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    image: ${API_IMAGE:-ghcr.io/cachenetworks/cdnpanel-api:latest}
    restart: unless-stopped
    environment:
      <<: *app-env
      SERVICE_NAME: cdn-worker
    command: ['node', 'dist/worker/index.js']
    volumes:
      - cdn-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'kill -0 1']
      interval: 30s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: infrastructure/docker/web.Dockerfile }
    image: ${WEB_IMAGE:-ghcr.io/cachenetworks/cdnpanel-web:latest}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-8873}:8080'
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/cdn.conf:/etc/nginx/conf.d/default.conf:ro
      - cdn-data:/data:ro
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1']
      interval: 15s

  clamav:
    profiles: [clamav]
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav-db:/var/lib/clamav

  minio:
    profiles: [minio]
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cdnminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  redis-data:
  cdn-data:
  clamav-db:
  minio-data:
